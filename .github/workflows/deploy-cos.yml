name: Deploy to Tencent Cloud COS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build dist
        run: |
          rm -rf dist && mkdir -p dist/assets dist/modules
          cp index.html dist/
          cp assets/config.js assets/logger.js assets/core.js assets/bazi.js \
             assets/ziwei.js assets/hehun.js assets/nameology.js assets/qian.js \
             assets/lingqian-anim.js \
             assets/kangxi-strokes.js assets/kangxi-alt.js assets/style.css dist/assets/
          cp modules/*.html dist/modules/

      - name: Install coscmd
        run: |
          pip install coscmd

      - name: Configure coscmd
        run: |
          cat > ~/.cos.conf <<EOF
          [common]
          secret_id = ${{ secrets.COS_SECRET_ID }}
          secret_key = ${{ secrets.COS_SECRET_KEY }}
          region = ap-guangzhou
          bucket = xuanjige-1252634115
          EOF

      - name: Upload to COS
        run: |
          cd dist
          coscmd upload -r ./ ./
