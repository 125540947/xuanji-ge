<!DOCTYPE html>

<head>

<meta property="og:title" content="玄机阁 · 灵签抽签">

<meta property="og:type" content="website">

</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<div class="wrap" id="main">
  <div class="topbar">
    <div class="brand"><span class="seal">玄</span><div><b>玄机阁</b><small>灵签抽签</small></div></div>
    <nav class="nav">
      <a href="../index.html">总纲</a><a href="lingqian.html">灵签</a><a href="huangli.html">黄历</a>
      <a href="bazi.html">八字</a><a href="ziwei.html">紫微</a><a href="hehun.html">合婚</a><a href="nameology.html">姓名学</a>
    </nav>
  </div>

  <header class="hero">
    <div class="kicker">心 诚 则 灵</div>
    <h1>灵签抽签</h1>
    <p class="edict">焚香默念所问之事，心静则签至。一签问一事，给象不给令。</p>
  </header>

  <div class="panel">
    <div class="qian-stage">
      <div class="qian-altar" id="altar">
        <div class="qian-tube" id="tube"><span class="qian-glyph">籤</span><div class="qian-shuffle" id="shuffle" aria-hidden="true"></div></div>
      </div>
      <button class="btn gold" id="drawBtn" aria-busy="false">求 签</button>
    </div>
    <div class="qian-result is-hidden" id="result" aria-live="polite">
      <div class="qian-no" id="qNo"></div>
      <div class="qian-level" id="qLevel"></div>
      <div class="qian-poem" id="qPoem"></div>
      <div class="qian-jie" id="qJie"></div>
      <div class="qian-edict" id="qEdict"></div>
    </div>
  </div>

  <div class="verse">「此签所言，皆象也，非令也。观其象，反诸身，吉凶在己，不在签。」<span class="src">— 灵签阁训</span></div>

  <div class="disclaimer">免责声明：灵签为中华民俗文化之娱乐体验，签诗解曰仅供观照，不作任何决策依据。</div>
  <footer>玄机阁 · 纯本地 · 生辰不出本机</footer>
</div>

<script defer src="../assets/config.js"></script>
<script defer src="../assets/logger.js"></script>
<script defer src="../assets/qian.js"></script>
<script defer src="../assets/lingqian-anim.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (window.XJ_LOG) XJ_LOG.install();
  (function () {
    var btn = document.getElementById('drawBtn');
    var altar = document.getElementById('altar');
    var tube = document.getElementById('tube');
    var shuffle = document.getElementById('shuffle');
    var result = document.getElementById('result');
    var lineIds = ['qNo', 'qLevel', 'qPoem', 'qJie', 'qEdict'];
    var lines = lineIds.map(function (id) { return document.getElementById(id); });

    var anim = new XJ_QIAN_ANIM.Anim({
      els: { altar: altar, tube: tube, shuffle: shuffle, btn: btn, result: result, lines: lines },
      getQian: function () { return XJ_QIAN.draw(); },
      hooks: {
        onReveal: function (q) {
          if (!q) return;
          document.getElementById('qNo').textContent = '第 ' + q.no + ' 签 · ' + q.title;
          document.getElementById('qLevel').textContent = q.level;
          document.getElementById('qPoem').textContent = q.poem;
          document.getElementById('qJie').textContent = '【解曰】' + q.jie;
          document.getElementById('qEdict').textContent = '【签诀】' + q.edict;
        },
        onComplete: function () {
          var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          result.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
        }
      }
    });

    btn.addEventListener('click', function () { anim.run(); });

    // 切到后台时立即定签，避免定时器被节流导致动画残留、按钮卡死
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) anim.settle();
    });
  })();
});
</script>
</body>
</html>
